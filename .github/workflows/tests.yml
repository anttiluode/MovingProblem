name: tests

on:
  push:
  pull_request:

jobs:
  gate0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python experiments/gate0_moving_basis.py
      - run: python experiments/gate1_local_temporal_learning.py
      - run: python experiments/gate2_drifting_representation.py
      - run: python experiments/gate3_stress_map.py
      - run: python experiments/gate4_topological_holonomy.py
